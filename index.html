<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة الموظفين</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div id="app">

        <!-- Login -->
        <section id="loginPage">

            <div class="login-box">

                <h1>نظام إدارة الموظفين</h1>

                <p>تسجيل دخول الإدارة</p>

                <input
                    type="email"
                    id="email"
                    placeholder="البريد الإلكتروني"
                >

                <input
                    type="password"
                    id="password"
                    placeholder="كلمة المرور"
                >

                <button id="loginBtn">
                    تسجيل الدخول
                </button>

                <div id="loginMessage"></div>

            </div>

        </section>


        <!-- Main App -->
        <section id="mainApp" class="hidden">

            <header class="topbar">

                <div>
                    <h2>نظام إدارة الموظفين</h2>
                </div>

                <button id="logoutBtn">
                    تسجيل الخروج
                </button>

            </header>


            <main>

                <div class="dashboard">

                    <div class="stat-card">

                        <span>إجمالي الموظفين</span>

                        <strong id="totalEmployees">
                            0
                        </strong>

                    </div>


                    <div class="stat-card">

                        <span>الموظفين النشطين</span>

                        <strong id="activeEmployees">
                            0
                        </strong>

                    </div>


                    <div class="stat-card">

                        <span>الإنذارات</span>

                        <strong id="totalWarnings">
                            0
                        </strong>

                    </div>


                    <div class="stat-card">

                        <span>الخصومات</span>

                        <strong id="totalDeductions">
                            0
                        </strong>

                    </div>

                </div>


               <div class="content">

    <div class="section-header">

        <h2>
            إدارة المستخدمين
        </h2>

        <button id="addUserBtn">
            + إضافة مستخدم
        </button>

    </div>


    <div id="usersContainer">

    </div>

</div> 
                <div class="content">

                    <div class="section-header">

                        <h2>
                            الموظفين
                        </h2>

                        <button id="addEmployeeBtn">
                            + إضافة موظف
                        </button>

                    </div>


                    <div class="search-area">

                        <input
                            type="text"
                            id="searchEmployee"
                            placeholder="بحث باسم الموظف..."
                        >

                    </div>


                    <div
                        id="employeesContainer"
                        class="employees-grid">
                    </div>

                </div>

            </main>

        </section>

    </div>


    <div
    id="userModal"
    class="modal hidden"
>

    <div class="modal-box">

        <h2>
            إضافة مستخدم
        </h2>


        <label>
            الموظف
        </label>

        <select id="userEmployee">

            <option value="">
                اختر الموظف
            </option>

        </select>


        <label>
            البريد الإلكتروني
        </label>

        <input
            type="email"
            id="userEmail"
            placeholder="employee@company.com"
        >


        <label>
            كلمة المرور
        </label>

        <input
            type="password"
            id="userPassword"
            placeholder="كلمة المرور"
        >


        <label>
            الصلاحية
        </label>

        <select id="userRole">

            <option value="viewer">
                Viewer
            </option>

            <option value="admin">
                Admin
            </option>

        </select>


        <div
            id="userMessage"
        ></div>


        <div class="modal-buttons">

            <button
                id="saveUserBtn"
            >
                إنشاء المستخدم
            </button>

            <button
                id="closeUserBtn"
            >
                إلغاء
            </button>

        </div>

    </div>

</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/config.js"></script>

    <script src="js/auth.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
